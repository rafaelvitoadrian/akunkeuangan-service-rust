# Public deployment: uses only your local .env.opensource values.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akunkeuangan}
      POSTGRES_USER: ${POSTGRES_USER:-akunkeuangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.opensource}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  akunkeuangan-rs:
    image: ${AKUN_IMAGE_REGISTRY:-registry.gitlab.com/rafaelvito11/akunkeuangan-service-rust}:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REPO_BACKEND: postgres
      DATABASE_URL: postgres://postgres:5432/${POSTGRES_DB:-akunkeuangan}
      PGUSER: ${POSTGRES_USER:-akunkeuangan}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.opensource}
      POSTGRES_AUTO_MIGRATE: "true"
      POSTGRES_BOOTSTRAP_USER: ${POSTGRES_BOOTSTRAP_USER:-}
      POSTGRES_BOOTSTRAP_ADMIN_EMAIL: ${POSTGRES_BOOTSTRAP_ADMIN_EMAIL:-}
      PORT: "9091"
      SERVER_PORT: "9091"
      APP_UTC_OFFSET_MINUTES: ${APP_UTC_OFFSET_MINUTES:-420}
      RUST_LOG: ${RUST_LOG:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_LOG_FILE: ""
    ports:
      - "${HOST_PORT:-9091}:9091"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:
