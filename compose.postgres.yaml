services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akunkeuangan}
      POSTGRES_USER: ${POSTGRES_USER:-akunkeuangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  akunkeuangan-rs:
    image: ${AKUN_POSTGRES_IMAGE:-akunkeuangan-rs:postgres-local}
    build:
      context: .
      dockerfile: Dockerfile.postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REPO_BACKEND: postgres
      DATABASE_URL: postgres://postgres:5432/${POSTGRES_DB:-akunkeuangan}
      # Credentials passed separately, so passwords do not need URL escaping.
      PGUSER: ${POSTGRES_USER:-akunkeuangan}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.postgres}
      POSTGRES_AUTO_MIGRATE: ${POSTGRES_AUTO_MIGRATE:-true}
      POSTGRES_BOOTSTRAP_USER: ${POSTGRES_BOOTSTRAP_USER:-}
      SERVER_PORT: "9091"
      APP_UTC_OFFSET_MINUTES: ${APP_UTC_OFFSET_MINUTES:-420}
      RUST_LOG: ${RUST_LOG:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_LOG_FILE: ""
    ports:
      - "${HOST_PORT:-9091}:9091"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
